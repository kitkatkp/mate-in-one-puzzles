name: Reproduce difficulty pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/research.yml'

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/requirements-lock.txt
      - run: npm ci
      - run: python -m pip install -r research/requirements-lock.txt
      - run: python -m unittest discover -s research -p 'test_*.py'
      - run: python research/prepare.py
      - run: npx tsx research/verify_with_chessjs.ts
      - run: python research/experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: difficulty-pilot-results
          path: research/artifacts/
